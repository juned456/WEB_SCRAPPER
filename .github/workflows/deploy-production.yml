name: Build and deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-scrapper-production
  cancel-in-progress: false

jobs:
  build-push-deploy:
    name: Test, publish, and deploy
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 30
    env:
      IMAGE_REPOSITORY: ${{ secrets.DOCKERHUB_USERNAME }}/sharia-stock-monitor

    steps:
      - name: Validate deployment secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          missing=0
          for name in DOCKERHUB_USERNAME DOCKERHUB_TOKEN PROD_HOST PROD_USER PROD_SSH_KEY PROD_KNOWN_HOSTS; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing Production environment secret: ${name}"
              missing=1
            fi
          done
          exit "$missing"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
            ${{ env.IMAGE_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$PROD_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Deploy exact image and verify
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          set -Eeuo pipefail
          ssh -p "${PROD_SSH_PORT:-22}" "${PROD_USER}@${PROD_HOST}" \
            "RELEASE_SHA='${GITHUB_SHA}' RELEASE_IMAGE='${IMAGE_REPOSITORY}:${GITHUB_SHA}' bash -s" <<'DEPLOY'
          set -Eeuo pipefail

          container_name='sharia-stock-monitor'
          compose_file=''
          compose_dir=''

          if docker inspect "$container_name" >/dev/null 2>&1; then
            compose_dir="$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}' "$container_name")"
            compose_file="$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project.config_files" }}' "$container_name")"
            compose_file="${compose_file%%,*}"
          fi

          if [[ -z "$compose_file" || ! -f "$compose_file" ]]; then
            compose_file=''
            for directory in \
              "$compose_dir" \
              '/www/server/panel/data/compose/sharia-stock-monitor' \
              '/www/server/panel/data/compose/Sharia stock monitor' \
              '/www/server/panel/data/compose/WEB SCRAPPER' \
              '/www/server/panel/data/compose/Web Scrapper'; do
              [[ -n "$directory" ]] || continue
              for candidate in "$directory/compose.yaml" "$directory/docker-compose.yaml"; do
                if [[ -f "$candidate" ]]; then
                  compose_dir="$directory"
                  compose_file="$candidate"
                  break 2
                fi
              done
            done
          else
            compose_dir="$(dirname "$compose_file")"
          fi

          if [[ -z "$compose_file" || ! -f "$compose_file" ]]; then
            echo 'Could not locate the aaPanel Compose file for sharia-stock-monitor.' >&2
            exit 1
          fi

          env_file="${compose_dir}/.env"
          candidate_file="${compose_file}.candidate"
          rollback_file="${compose_file}.rollback"
          if [[ ! -f "$env_file" ]]; then
            echo "Missing production environment file: $env_file" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_IMAGE" =~ ^[a-z0-9][a-z0-9._/-]*:[0-9a-f]{40}$ ]]; then
            echo "Invalid immutable release image: $RELEASE_IMAGE" >&2
            exit 1
          fi

          cp -a "$compose_file" "$rollback_file"
          sed -E \
            "s|^([[:space:]]*image:[[:space:]]*).*$|\\1${RELEASE_IMAGE}|" \
            "$rollback_file" > "$candidate_file"
          replacement_count="$(grep -cF "image: ${RELEASE_IMAGE}" "$candidate_file" || true)"
          if [[ "$replacement_count" -ne 1 ]]; then
            echo "Expected one image entry in $compose_file; found $replacement_count." >&2
            rm -f "$candidate_file"
            exit 1
          fi
          install -m 600 "$candidate_file" "$compose_file"
          rm -f "$candidate_file"

          compose=(docker compose --env-file "$env_file" -f "$compose_file")
          rollback() {
            echo "Release ${RELEASE_SHA} failed; restoring the previous Compose release." >&2
            if [[ -f "$rollback_file" ]]; then
              cp -a "$rollback_file" "$compose_file"
              "${compose[@]}" up -d --no-build --force-recreate --remove-orphans || true
            fi
            "${compose[@]}" ps || true
            "${compose[@]}" logs --tail=150 app || true
          }
          trap rollback ERR

          "${compose[@]}" config --quiet
          configured_images="$("${compose[@]}" config --images | sort -u)"
          if [[ "$configured_images" != "$RELEASE_IMAGE" ]]; then
            echo 'Compose resolved unexpected images:' >&2
            printf '%s\n' "$configured_images" >&2
            false
          fi

          "${compose[@]}" pull app
          "${compose[@]}" up -d --no-build --force-recreate --remove-orphans app

          healthy=0
          for attempt in $(seq 1 36); do
            container_id="$("${compose[@]}" ps -q app)"
            container_health=''
            if [[ -n "$container_id" ]]; then
              container_health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container_id")"
            fi
            if [[ "$container_health" == 'healthy' ]] \
              && curl --fail --silent --show-error http://127.0.0.1:3002/api/status >/dev/null; then
              healthy=1
              break
            fi
            sleep 5
          done

          if [[ "$healthy" -ne 1 ]]; then
            echo "Release ${RELEASE_SHA} did not become healthy within 180 seconds." >&2
            false
          fi

          running_image="$(docker inspect --format '{{.Config.Image}}' "$container_id")"
          if [[ "$running_image" != "$RELEASE_IMAGE" ]]; then
            echo "Container is running unexpected image: $running_image" >&2
            false
          fi

          trap - ERR
          rm -f "$rollback_file"
          "${compose[@]}" ps
          docker image prune -f --filter 'until=168h'
          DEPLOY
